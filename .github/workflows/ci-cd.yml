name: Polyglot CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

env:
  GOTOOLCHAIN: auto

jobs:
  go-ci:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Distributed-Config
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/distributed-config
          path: distributed-config
          ref: ${{ github.ref_name }}
      - name: Checkout Flexible-Logger
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/flexible-logger
          path: flexible-logger
          ref: ${{ github.ref_name }}
      - name: Checkout Microservice-Toolbox
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/microservice-toolbox
          path: microservice-toolbox
          ref: ${{ github.ref_name }}
      - name: Checkout Universal-Logger
        uses: actions/checkout@v4
        with:
          path: universal-logger

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go Tests
        working-directory: universal-logger
        run: |
          go mod tidy
          go test -v ./src/...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61.0

      - name: Run golangci-lint
        working-directory: universal-logger
        run: $(go env GOPATH)/bin/golangci-lint run

  python-ci:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Distributed-Config
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/distributed-config
          path: distributed-config
          ref: ${{ github.ref_name }}
      - name: Checkout Flexible-Logger
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/flexible-logger
          path: flexible-logger
          ref: ${{ github.ref_name }}
      - name: Checkout Microservice-Toolbox
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/microservice-toolbox
          path: microservice-toolbox
          ref: ${{ github.ref_name }}
      - name: Checkout Universal-Logger
        uses: actions/checkout@v4
        with:
          path: universal-logger

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Python SDK
        working-directory: universal-logger/python
        run: |
          pip install pytest
          python setup.py build_go
          pip install -e .
          pytest

  rust-ci:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Distributed-Config
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/distributed-config
          path: distributed-config
          ref: ${{ github.ref_name }}
      - name: Checkout Flexible-Logger
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/flexible-logger
          path: flexible-logger
          ref: ${{ github.ref_name }}
      - name: Checkout Microservice-Toolbox
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/microservice-toolbox
          path: microservice-toolbox
          ref: ${{ github.ref_name }}
      - name: Checkout Universal-Logger
        uses: actions/checkout@v4
        with:
          path: universal-logger

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91

      - name: Test Rust SDK
        working-directory: universal-logger/rust
        run: cargo test